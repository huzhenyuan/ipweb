name: ipweb-wordpress

services:
  nginx:
    image: ${NGINX_IMAGE:-docker.io/library/nginx:1.28-alpine}
    restart: unless-stopped
    environment:
      PUBLIC_IP: ${PUBLIC_IP:?Set PUBLIC_IP in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/http.conf:/etc/nginx/conf.d/default.conf:ro,z
      - ./nginx/wordpress-https.conf:/config/https.conf:ro,z
      - ./scripts/nginx-entrypoint.sh:/scripts/nginx-entrypoint.sh:ro,z
      - acme-webroot:/var/www/certbot:ro
      - letsencrypt:/etc/letsencrypt:ro
    entrypoint: ["/bin/sh", "/scripts/nginx-entrypoint.sh"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      - wordpress

  certbot:
    image: ${CERTBOT_IMAGE:-docker.io/certbot/certbot:v5.4.0}
    restart: unless-stopped
    environment:
      PUBLIC_IP: ${PUBLIC_IP:?Set PUBLIC_IP in .env}
      CERTBOT_EMAIL: ${CERTBOT_EMAIL:?Set CERTBOT_EMAIL in .env}
    volumes:
      - ./scripts/certbot-loop.sh:/scripts/certbot-loop.sh:ro,z
      - acme-webroot:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
      - certbot-work:/var/lib/letsencrypt
    entrypoint: ["/bin/sh", "/scripts/certbot-loop.sh"]
    depends_on:
      nginx:
        condition: service_healthy

  wordpress:
    image: ${WORDPRESS_IMAGE:-docker.io/library/wordpress:php8.3-apache}
    restart: unless-stopped
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME:?Set DB_NAME in .env}
      WORDPRESS_DB_USER: ${DB_USER:?Set DB_USER in .env}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      WP_SITE_URL: ${WP_SITE_URL:?Set WP_SITE_URL in .env}
      WORDPRESS_CONFIG_EXTRA: |
        if (isset($$_SERVER['HTTP_X_FORWARDED_PROTO']) && $$_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') {
          $$_SERVER['HTTPS'] = 'on';
        }
        define('WP_HOME', getenv('WP_SITE_URL'));
        define('WP_SITEURL', getenv('WP_SITE_URL'));
    volumes:
      - wordpress-data:/var/www/html
    depends_on:
      - db

  db:
    image: ${MARIADB_IMAGE:-docker.io/library/mariadb:11.4}
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:?Set DB_NAME in .env}
      MARIADB_USER: ${DB_USER:?Set DB_USER in .env}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/mysql

volumes:
  acme-webroot:
  letsencrypt:
  certbot-work:
  wordpress-data:
  db-data:
